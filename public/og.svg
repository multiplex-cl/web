<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081628"/>
      <stop offset="1" stop-color="#0f2c47"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="80" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1479BE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop stop-color="#1479BE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1479BE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- molecular nodes -->
  <g stroke="url(#accent)" stroke-width="1.5" opacity="0.4">
    <line x1="900" y1="140" x2="1040" y2="90"/>
    <line x1="1040" y1="90" x2="1120" y2="200"/>
    <line x1="900" y1="140" x2="980" y2="270"/>
    <line x1="980" y1="270" x2="1120" y2="200"/>
    <line x1="980" y1="270" x2="1060" y2="380"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="900" cy="140" r="8"/>
    <circle cx="1040" cy="90" r="10"/>
    <circle cx="1120" cy="200" r="7"/>
    <circle cx="980" cy="270" r="9"/>
    <circle cx="1060" cy="380" r="7"/>
  </g>

  <!-- chromosome-X mark -->
  <g transform="translate(64,60) scale(2.0)" fill="url(#accent)">
    <rect x="20.9" y="14.05" width="7.2" height="2.9" rx="1.45"/>
    <rect x="24.5" y="10.45" width="7.2" height="2.9" rx="1.45"/>
    <rect x="28.2" y="6.75" width="7.2" height="2.9" rx="1.45"/>
    <rect x="11.9" y="14.05" width="7.2" height="2.9" rx="1.45"/>
    <rect x="8.3" y="10.45" width="7.2" height="2.9" rx="1.45"/>
    <rect x="4.6" y="6.75" width="7.2" height="2.9" rx="1.45"/>
    <rect x="20.9" y="23.05" width="7.2" height="2.9" rx="1.45"/>
    <rect x="24.5" y="26.65" width="7.2" height="2.9" rx="1.45"/>
    <rect x="28.2" y="30.35" width="7.2" height="2.9" rx="1.45"/>
    <rect x="11.9" y="23.05" width="7.2" height="2.9" rx="1.45"/>
    <rect x="8.3" y="26.65" width="7.2" height="2.9" rx="1.45"/>
    <rect x="4.6" y="30.35" width="7.2" height="2.9" rx="1.45"/>
  </g>

  <text x="160" y="145" fill="#ffffff" font-family="Sora, Inter, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="1" style="text-transform:uppercase">Multiplex</text>

  <text x="80" y="320" fill="#ffffff" font-family="Sora, Inter, system-ui, sans-serif" font-size="60" font-weight="700">La próxima generación de productos</text>
  <text x="80" y="392" fill="#ffffff" font-family="Sora, Inter, system-ui, sans-serif" font-size="60" font-weight="700">genéticos y epigenéticos</text>
  <text x="80" y="500" fill="#5AB0E4" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" letter-spacing="1">GENÉTICA · EPIGENÉTICA · MEDICINA PERSONALIZADA</text>
</svg>
